<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login Form</title>
  <link rel="stylesheet" href="style.css">
  <!-- Иконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="card-container">
    <!-- Левая часть: 3D Персонаж -->
    <div class="character-section">
      <img src="https://cdni.iconscout.com/illustration/premium/thumb/3d-male-avatar-6299539-5187871.png" alt="3D Character" class="character-img">
    </div>

    <!-- Правая часть: Форма -->
    <div class="form-section">
      <h2>Register Now</h2>
      <p class="subtitle">Fill in this form to participate in our Online workshop Event series.</p>

      <form onsubmit="return false;">
        <div class="input-group">
          <i class="fa-solid fa-user icon"></i>
          <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-envelope icon"></i>
          <input type="email" placeholder="Email Address" required>
        </div>

        <button type="submit" class="submit-btn">NEXT</button>
      </form>

      <div class="footer-links">
        <a href="#">Powered by AccessForm</a>
      </div>
    </div>
  </div>

</body>
</html>
